<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Taean west-coast entry and protected backhaul schematic</title>
  <desc id="desc">A schematic showing an international subsea cable landing at Taean and two protected paths connecting to Seoul and the customer network.</desc>
  <rect width="1400" height="1000" fill="#06183f"/>
  <rect x="0" width="410" height="1000" fill="#0d2b70"/>
  <path d="M410 0C360 120 452 205 405 310C360 412 450 500 406 610C364 716 450 812 410 1000H1400V0Z" fill="#0a2259"/>
  <g fill="none" stroke="#254786" stroke-width="1">
    <path d="M520 100H1320"/><path d="M520 900H1320"/>
    <path d="M630 100V900"/><path d="M940 100V900"/><path d="M1240 100V900"/>
  </g>
  <text x="80" y="100" fill="#9db3e8" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">YELLOW SEA</text>
  <text x="520" y="100" fill="#9db3e8" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">WEST COAST ENTRY</text>
  <text x="520" y="148" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="600">Taean to Seoul</text>
  <text x="520" y="190" fill="#9db3e8" font-family="Arial, sans-serif" font-size="18">Protected domestic backhaul flow</text>
  <path d="M80 500C160 450 240 550 330 500S430 500 480 500" fill="none" stroke="#80a8ff" stroke-width="4"/>
  <path d="M480 500C620 500 660 352 820 352H990" fill="none" stroke="#5f8cff" stroke-width="5"/>
  <path d="M480 500C620 500 660 648 820 648H990" fill="none" stroke="#d62d78" stroke-width="5"/>
  <path d="M990 352C1090 352 1090 500 1180 500H1320" fill="none" stroke="#5f8cff" stroke-width="5"/>
  <path d="M990 648C1090 648 1090 500 1180 500" fill="none" stroke="#d62d78" stroke-width="5"/>
  <g>
    <circle cx="480" cy="500" r="22" fill="#d62d78"/><circle cx="480" cy="500" r="9" fill="#fff"/>
    <circle cx="990" cy="352" r="18" fill="#06183f" stroke="#5f8cff" stroke-width="5"/>
    <circle cx="990" cy="648" r="18" fill="#06183f" stroke="#d62d78" stroke-width="5"/>
    <circle cx="1180" cy="500" r="20" fill="#fff"/>
    <circle cx="1320" cy="500" r="16" fill="#80a8ff"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="430" y="560" fill="#fff" font-size="21" font-weight="600">TAEAN CLS</text>
    <text x="430" y="590" fill="#9db3e8" font-size="16">Cable landing station</text>
    <text x="860" y="315" fill="#fff" font-size="18" font-weight="600">PRIMARY PATH</text>
    <text x="842" y="710" fill="#fff" font-size="18" font-weight="600">PROTECTED PATH</text>
    <text x="1110" y="555" fill="#fff" font-size="20" font-weight="600">SEOUL</text>
    <text x="1090" y="585" fill="#9db3e8" font-size="16">Telehouse</text>
    <text x="1260" y="555" fill="#fff" font-size="18" font-weight="600">CUSTOMER</text>
  </g>
  <g transform="translate(520 840)" font-family="Arial, sans-serif" font-size="15">
    <line x1="0" y1="0" x2="48" y2="0" stroke="#5f8cff" stroke-width="5"/><text x="65" y="5" fill="#c2cff0">Primary path</text>
    <line x1="230" y1="0" x2="278" y2="0" stroke="#d62d78" stroke-width="5"/><text x="295" y="5" fill="#c2cff0">Protected path</text>
    <text x="580" y="5" fill="#748bbd">Route view</text>
  </g>
</svg>