<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Dacom Crossing ownership structure</title>
<desc id="desc">LG U+ 51 percent and Telstra 49 percent joint ownership structure</desc>
<rect width="1200" height="760" fill="#f5f8ff"/>
<path d="M0 110H1200M0 650H1200" stroke="#d8e0ef"/>
<text x="70" y="72" fill="#1647d8" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">JOINT OWNERSHIP</text>
<g font-family="Arial, sans-serif">
  <text x="120" y="280" fill="#10244b" font-size="44" font-weight="700">LG U+</text>
  <text x="120" y="340" fill="#1647d8" font-size="72" font-weight="700">51%</text>
  <text x="930" y="280" fill="#10244b" font-size="44" font-weight="700" text-anchor="end">Telstra</text>
  <text x="930" y="340" fill="#d62d78" font-size="72" font-weight="700" text-anchor="end">49%</text>
  <path d="M315 310H470M730 310H885" stroke="#1647d8" stroke-width="2"/>
  <circle cx="470" cy="310" r="6" fill="#1647d8"/><circle cx="730" cy="310" r="6" fill="#d62d78"/>
  <rect x="470" y="215" width="260" height="190" rx="2" fill="#fff" stroke="#1647d8" stroke-width="2"/>
  <text x="600" y="286" fill="#10244b" font-size="31" font-weight="700" text-anchor="middle">Dacom</text>
  <text x="600" y="326" fill="#10244b" font-size="31" font-weight="700" text-anchor="middle">Crossing</text>
  <text x="600" y="366" fill="#667089" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">SINCE 2001</text>
  <text x="70" y="704" fill="#667089" font-size="17">International private lines · Taean CLS · Domestic backhaul · Seocho Telehouse</text>
</g>
</svg>