<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">24/365 network monitoring flow</title>
<desc id="desc">Taean cable landing station, two domestic backhaul routes, Seocho Telehouse and customer connection monitoring flow</desc>
<rect width="1200" height="760" fill="#f5f8ff"/>
<text x="70" y="72" fill="#1647d8" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">24/365 NETWORK MONITORING</text>
<g font-family="Arial, sans-serif">
  <rect x="70" y="145" width="1060" height="430" rx="3" fill="#10244b"/>
  <text x="110" y="200" fill="#9fb2e6" font-size="13" font-weight="700" letter-spacing="2">CURRENT STATUS</text>
  <text x="1090" y="200" fill="#6fe0ae" font-size="13" font-weight="700" text-anchor="end">MONITORING</text>
  <path d="M180 350H1020" stroke="#5271c9" stroke-width="2"/>
  <path d="M370 350C470 250 570 250 670 350S870 450 960 350" fill="none" stroke="#d62d78" stroke-width="2" opacity=".9"/>
  <g fill="#fff" text-anchor="middle">
    <circle cx="180" cy="350" r="12" fill="#6fe0ae"/><text x="180" y="400" font-size="18" font-weight="700">Taean CLS</text><text x="180" y="427" fill="#9fb2e6" font-size="13">Cable landing</text>
    <circle cx="470" cy="350" r="12" fill="#6fe0ae"/><text x="470" y="400" font-size="18" font-weight="700">Backhaul 01</text><text x="470" y="427" fill="#9fb2e6" font-size="13">Hongseong · Pyeongtaek</text>
    <circle cx="720" cy="350" r="12" fill="#6fe0ae"/><text x="720" y="400" font-size="18" font-weight="700">Backhaul 02</text><text x="720" y="427" fill="#9fb2e6" font-size="13">Daejeon · Cheonan · Osan</text>
    <circle cx="1020" cy="350" r="12" fill="#6fe0ae"/><text x="1020" y="400" font-size="18" font-weight="700">Telehouse</text><text x="1020" y="427" fill="#9fb2e6" font-size="13">Seoul access</text>
  </g>
  <text x="70" y="660" fill="#1647d8" font-size="34" font-weight="700">MONITOR</text>
  <text x="300" y="660" fill="#10244b" font-size="34" font-weight="700">IDENTIFY</text>
  <text x="555" y="660" fill="#10244b" font-size="34" font-weight="700">SWITCH</text>
  <text x="770" y="660" fill="#10244b" font-size="34" font-weight="700">RECOVER</text>
  <circle cx="1090" cy="650" r="8" fill="#d62d78"/>
</g>
</svg>